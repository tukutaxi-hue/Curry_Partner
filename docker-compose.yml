# Optional local Postgres. After the first start, run `pnpm db:setup`
# with PG_SUPER_URL set, or use the Ubuntu package and `pnpm db:init`.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-dev-change-me
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - curry_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  curry_pg:
